[package]
name = "logsure"
version = "0.5.0"
edition = "2024"
description = "A terminal console for LogSure: analytics, the inbox and the waitlists from the keyboard."
license = "MPL-2.0"
repository = "https://github.com/logsure/terminal"
readme = "README.md"
rust-version = "1.88"

[[bin]]
name = "logsure"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
ratatui = "0.30"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
ureq = { version = "2", features = ["json"] }
